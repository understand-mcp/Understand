name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      # The matrix is the point. Two-OS support otherwise rests on reasoning
      # rather than on a test run, and Windows is where path handling, the
      # sqlite driver and the regex engine all differ from POSIX.
      #
      # macOS lives in its own workflow (ci-macos.yml). The macOS legs here
      # were cancelled over and over because the account had no macOS runner
      # free, and one cancelled leg turns the whole run red. macOS support is
      # real and is still tested, but it no longer decides whether this
      # repository is green.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Test
        run: python -m pytest -q

      - name: Ruff
        run: |
          python -m pip install ruff
          # tests/fixtures holds a deliberately broken file: it proves the
          # parser reports a failure instead of crashing. Ruff cannot parse
          # it either, and a linter that stops on a fixture is a linter that
          # never runs for anyone.
          python -m ruff check src tests tools --exclude tests/fixtures

  sarif:
    # The SARIF output is validated against the official OASIS schema, not
    # against this project's own opinion of what SARIF looks like. A structural
    # check passes on output a real consumer would reject.
    name: sarif schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . jsonschema

      - name: Validate against the OASIS SARIF 2.1.0 schema
        run: python tools/validate_sarif.py

  scan-self:
    # The tool scans itself in CI. A security tool that cannot survive its own
    # output has a problem worth finding before a user finds it.
    name: scan this repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Scan
        # No --no-report here: it deliberately suppresses the output file, and
        # the step below needs the file. `|| true` because a scan that finds
        # findings must not fail the build -- the report is the deliverable,
        # not a gate. Use --fail-on if you want it to be one.
        run: |
          python -m understand.cli scan . security bugs architecture \
            --deep --cross-module --format sarif \
            --output understand.sarif || true

      - name: Publish the report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: understand.sarif

  build:
    name: build the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t understand-mcp:ci .
      - name: The image must not start as root
        run: |
          set -e
          uid=$(docker run --rm --entrypoint sh understand-mcp:ci -c 'id -u')
          echo "runtime uid: $uid"
          test "$uid" != "0"
