name: release bundle

# Builds the MCPB archive from source and attaches it to the published
# release, so the distributable bundle is reproducible from the
# repository instead of being uploaded by hand.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bundle:
    name: build and attach the bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the MCPB CLI
        run: npm install -g @anthropic-ai/mcpb
      - name: Build the bundle
        run: python tools/build_mcpb.py --out-dir dist
      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.mcpb --clobber
