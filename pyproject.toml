[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "understand-mcp"
version = "0.1.6"
description = "UNDERSTAND - repository-wide code intelligence, security and defect analysis engine with a CLI and an MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "UNDERSTAND contributors" }]
keywords = ["static-analysis", "security", "mcp", "code-intelligence", "sarif"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "mcp>=2.0,<3.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "build>=1.2",
]
# Optional grammar for exact TypeScript/JavaScript structure. Without it the
# engine falls back to the lexical parser, which never fails but cannot see
# nesting such as class members or interface heritage. Install with
# `pip install "understand-mcp[ts]"`.
ts = [
  "tree-sitter>=0.23",
  "tree-sitter-typescript>=0.23",
]

[project.scripts]
understand = "understand.cli:run"
# Dedicated console script for the MCP server so that clients which cannot
# reference a virtualenv's interpreter (or a module path) can still start it
# with a single executable name, e.g. `understand-mcp-server`.
understand-mcp-server = "understand.mcp.server:main"

[project.urls]
# The repository is published at understand-mcp/Understand.
Homepage = "https://github.com/understand-mcp/Understand"
Documentation = "https://github.com/understand-mcp/Understand/tree/main/docs"
Issues = "https://github.com/understand-mcp/Understand/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
understand = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", "*.egg", ".*", "build", "dist"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110

target-version = "py311"

# SIM112 wants SCREAMING_CASE environment variable names. The Windows variable
# is `SystemRoot`, mixed case, and renaming the literal would stop the
# protected-path check from ever matching on Windows.
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008", "E501", "RUF001", "RUF002", "RUF003", "SIM108",
    # SIM112 wants SCREAMING_CASE environment variable names. The Windows variable
    # is `SystemRoot`, mixed case, and renaming the literal would stop the
    # protected-path check from ever matching on Windows.
    "SIM112",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
disallow_untyped_defs = false